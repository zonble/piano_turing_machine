      <h1>Piano Turing Machine — What if player pianos had bidirectional tapes?</h1>
      <p>
        An interactive 1900s pneumatic and clockwork computing exhibit. Every physical component required to build Alan Turing's 1936 universal machine already existed in 1900 inside a parlor player piano and a brass mechanical calculator: a bidirectional perforated paper tape with a pneumatic tracker bar, an 8-tooth state spur gear, and a 9-gear rotary turret driving a 4-notch arithmetic ratchet wheel.
